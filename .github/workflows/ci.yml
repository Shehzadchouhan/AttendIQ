name: FaceMark CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check backend/

  backend-test:
    name: Backend Tests & Coverage (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facemark_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenCV / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/facemark_test_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest with Coverage (>= 70%)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/facemark_test_db
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/facemark_test_db
          SECRET_KEY: ci-test-secret-key-32-characters-minimum!
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -v

  frontend-lint-and-test:
    name: Frontend Lint, Vitest Smoke Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Smoke Tests
        run: |
          cd frontend
          npm test

      - name: Build Production Frontend Bundle
        run: |
          cd frontend
          npm run build

  docker-build-check:
    name: Production Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: facemark-backend:ci-check

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: facemark-frontend:ci-check
